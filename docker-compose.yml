version: '3.8'

services:
  # 1. Cơ sở dữ liệu chính
  postgres:
    image: postgres:15-alpine
    container_name: temead_postgres
    environment:
      POSTGRES_DB: temead_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 2. Redis Message Broker cho Queue
  redis:
    image: redis:7-alpine
    container_name: temead_redis
    ports:
      - "6379:6379"
    restart: always

  # 3. Streamlit Frontend & API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temead_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    restart: always

  # 4. Celery Worker xử lý tác vụ đăng bài ngầm
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temead_worker
    command: celery -A core.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app
    restart: always

volumes:
  postgres_data:
